<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADF PTI — Circuit Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1f16;--ink2:#242920;--red:#c8392b;--red2:#e05a40;--orange:#e8a020;--cream:#f5f2eb;--sand:#ede8dc;--card:#ffffff;--border:#d0c8b8;--muted:#7a7060;--text:#1a1a16;--text2:#55504a;--radius:4px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
header{background:var(--ink);color:#fff;padding:0 2rem;display:flex;align-items:stretch;border-bottom:3px solid var(--red);}
.hflag{background:var(--red);width:6px;margin-right:1.5rem;}
.htext{padding:1.25rem 0;}
.hey{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:4px;}
header h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1;}
header h1 span{color:var(--red2);}
.hsub{font-size:12px;color:#aaa;margin-top:4px;font-weight:300;}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;}
.hlink{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius);padding:4px 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#aaa;font-weight:600;text-decoration:none;}
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 72px);}
.sidebar{background:var(--sand);border-right:1px solid var(--border);padding:1.5rem;overflow-y:auto;}
.slabel{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:.75rem;padding-bottom:5px;border-bottom:1px solid var(--border);}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:.75rem;}
.fg label{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2);}
input,select,textarea{font-family:'Barlow',sans-serif;font-size:13.5px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--text);width:100%;}
input:focus,select:focus{outline:none;border-color:var(--red);}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:.75rem;}
.btn-gen{width:100%;background:var(--ink);color:#fff;border:none;border-radius:var(--radius);padding:13px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:.75rem;}
.btn-gen:hover{background:var(--red);}
.output{padding:2rem;overflow-y:auto;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:400px;text-align:center;opacity:.45;}
.empty-icon{width:64px;height:64px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;font-size:28px;}
.empty h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.empty p{font-size:13px;color:var(--muted);}
.rpt-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid var(--ink);}
.rpt-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1.1;}
.rpt-title span{color:var(--red);}
.rpt-meta{font-size:12px;color:var(--muted);margin-top:4px;}
.stats-bar{background:var(--ink);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1.25rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;}
.stat-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:3px;}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--orange);}
.btn-sec{background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:var(--radius);padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;}
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);margin-bottom:.75rem;padding-bottom:5px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';display:inline-block;width:4px;height:13px;background:var(--red);border-radius:2px;}
.ex-row{display:grid;grid-template-columns:30px 1fr 120px 100px;gap:10px;padding:9px 10px;border-bottom:1px solid var(--border);align-items:center;font-size:13px;}
.ex-row:last-child{border-bottom:none;}
.ex-num{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--red);}
.ex-name{font-weight:600;color:var(--ink);}
.ex-detail{font-size:11px;color:var(--muted);margin-top:2px;}
.ex-load{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--ink);text-align:right;}
.ex-rest{font-size:11px;color:var(--muted);text-align:right;}
.round-badge{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:2px;margin-bottom:.75rem;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;}
.structure-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem;}
.struct-card{background:var(--sand);border-radius:var(--radius);padding:10px 12px;text-align:center;}
.struct-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.struct-val{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--ink);}
.disclaimer{background:var(--sand);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-top:1rem;font-size:12px;color:var(--muted);font-style:italic;}
@media(max-width:900px){.layout{grid-template-columns:1fr;}}
@media print{.sidebar,.hright{display:none!important;}.layout{display:block;}.output{padding:1rem;}}
</style>
</head>
<body>
<header>
  <div class="hflag"></div>
  <div class="htext">
    <div class="hey">Australian Defence Force</div>
    <h1>PTI <span>Circuit</span> Generator</h1>
    <div class="hsub">Structured Circuit Training Session Builder</div>
  </div>
  <div class="hright"><a class="hlink" href="index.html">← Back to Tools</a></div>
</header>
<div class="layout">
  <div class="sidebar">
    <div class="slabel">Session Details</div>
    <div class="fg"><label>Session Name / Group</label><input type="text" id="sessName" placeholder="e.g. Alpha Sqn Wednesday Circuit"></div>
    <div class="fgrid2">
      <div class="fg"><label>Number of Personnel</label><input type="number" id="pax" placeholder="e.g. 20" min="1" max="200"></div>
      <div class="fg"><label>Fitness Level</label><select id="level"><option value="beginner">Beginner</option><option value="intermediate" selected>Intermediate</option><option value="advanced">Advanced</option></select></div>
    </div>
    <div class="slabel">Circuit Setup</div>
    <div class="fgrid2">
      <div class="fg"><label>Circuit Type</label>
        <select id="circType">
          <option value="strength">Strength Focus</option>
          <option value="cardio">Cardio Focus</option>
          <option value="mixed" selected>Mixed (Strength + Cardio)</option>
          <option value="core">Core Focus</option>
          <option value="upper">Upper Body Focus</option>
          <option value="lower">Lower Body Focus</option>
        </select>
      </div>
      <div class="fg"><label>Format</label>
        <select id="format">
          <option value="timed" selected>Timed (work:rest)</option>
          <option value="reps">Reps Based</option>
          <option value="emom">EMOM</option>
        </select>
      </div>
    </div>
    <div class="fgrid2">
      <div class="fg"><label>Number of Stations</label>
        <select id="stations"><option value="6">6 stations</option><option value="8" selected>8 stations</option><option value="10">10 stations</option><option value="12">12 stations</option></select>
      </div>
      <div class="fg"><label>Rounds</label>
        <select id="rounds"><option value="2">2 rounds</option><option value="3" selected>3 rounds</option><option value="4">4 rounds</option><option value="5">5 rounds</option></select>
      </div>
    </div>
    <div class="fgrid2">
      <div class="fg"><label>Work Period</label>
        <select id="work"><option value="30">30 seconds</option><option value="40" selected>40 seconds</option><option value="45">45 seconds</option><option value="60">60 seconds</option></select>
      </div>
      <div class="fg"><label>Rest Period</label>
        <select id="rest"><option value="15">15 seconds</option><option value="20" selected>20 seconds</option><option value="30">30 seconds</option><option value="45">45 seconds</option></select>
      </div>
    </div>
    <div class="fg"><label>Equipment Available</label>
      <select id="equipment">
        <option value="bodyweight">Bodyweight Only</option>
        <option value="basic" selected>Basic (cones, mats, bands)</option>
        <option value="gym">Full Gym Equipment</option>
        <option value="outdoor">Outdoor / Parade Ground</option>
      </select>
    </div>
    <div class="fg"><label>Focus / Notes</label>
      <textarea id="notes" placeholder="e.g. Pre-PFA focus, avoid upper body — recent shoulder injuries in group"></textarea>
    </div>
    <button class="btn-gen" onclick="generate()">Generate Circuit</button>
  </div>
  <div class="output">
    <div class="empty" id="emptyState">
      <div class="empty-icon">⚡</div>
      <h2>No Circuit Generated</h2>
      <p>Configure the session details and press<br>Generate Circuit.</p>
    </div>
    <div id="reportArea" style="display:none;"></div>
  </div>
</div>
<script>
const EXERCISES={
  strength:{upper:['Push-Ups','Tricep Dips','Pike Push-Ups','Diamond Push-Ups','Decline Push-Ups','Wide Push-Ups'],lower:['Squats','Lunges','Bulgarian Split Squats','Step-Ups','Wall Sit','Calf Raises'],core:['Plank','Sit-Ups','Leg Raises','Flutter Kicks','Russian Twists','Hollow Hold'],full:['Burpees','Mountain Climbers','Bear Crawl','Inchworm','Man Makers']},
  cardio:['Star Jumps','High Knees','Skipping (in place)','Lateral Shuffles','Box Steps','Sprint on Spot','Tuck Jumps','Lateral Jumps'],
  core:['Plank','Side Plank (L)','Side Plank (R)','Sit-Ups','Leg Raises','Flutter Kicks','Russian Twists','Hollow Hold','Dead Bug','Bicycle Crunches','V-Sits','Plank Shoulder Taps']
};

function buildExList(type,count,equipment){
  const list=[];
  if(type==='core'){
    const pool=[...EXERCISES.core];
    while(list.length<count&&pool.length>0){const i=Math.floor(Math.random()*pool.length);list.push({name:pool[i],cat:'Core'});pool.splice(i,1);}
  } else if(type==='cardio'){
    const pool=[...EXERCISES.cardio];
    while(list.length<count&&pool.length>0){const i=Math.floor(Math.random()*pool.length);list.push({name:pool[i],cat:'Cardio'});pool.splice(i,1);}
  } else if(type==='upper'){
    const pool=[...EXERCISES.strength.upper,...EXERCISES.strength.core];
    while(list.length<count&&pool.length>0){const i=Math.floor(Math.random()*pool.length);list.push({name:pool[i],cat:'Upper'});pool.splice(i,1);}
  } else if(type==='lower'){
    const pool=[...EXERCISES.strength.lower,...EXERCISES.cardio.slice(0,4)];
    while(list.length<count&&pool.length>0){const i=Math.floor(Math.random()*pool.length);list.push({name:pool[i],cat:'Lower'});pool.splice(i,1);}
  } else if(type==='strength'){
    const pool=[...EXERCISES.strength.upper,...EXERCISES.strength.lower,...EXERCISES.strength.full];
    while(list.length<count&&pool.length>0){const i=Math.floor(Math.random()*pool.length);list.push({name:pool[i],cat:'Strength'});pool.splice(i,1);}
  } else {
    // mixed
    const pools=[EXERCISES.strength.upper,EXERCISES.strength.lower,EXERCISES.core,EXERCISES.cardio];
    const cats=['Upper','Lower','Core','Cardio'];
    let pi=0;
    const used=new Set();
    while(list.length<count){
      const pool=pools[pi%4];
      const avail=pool.filter(e=>!used.has(e));
      if(avail.length>0){const e=avail[Math.floor(Math.random()*avail.length)];used.add(e);list.push({name:e,cat:cats[pi%4]});}
      pi++;
      if(pi>count*4)break;
    }
  }
  return list.slice(0,count);
}

function getLoad(format,work,rest,level,exName){
  const lvlMap={beginner:{reps:10,mod:'3 sets'},intermediate:{reps:15,mod:'3 sets'},advanced:{reps:20,mod:'4 sets'}};
  const l=lvlMap[level]||lvlMap.intermediate;
  if(format==='reps') return `${l.reps} reps`;
  if(format==='emom') return `Max reps in 1 min`;
  return `${work}s work / ${rest}s rest`;
}

function getCoachNote(name,level){
  const notes={
    'Push-Ups':'Keep core tight, chest to floor',
    'Squats':'Knees tracking over toes, full depth',
    'Plank':'Neutral spine — no sagging hips',
    'Burpees':'Controlled descent, explosive jump',
    'Lunges':'90° at both knees, upright torso',
    'Sit-Ups':'Feet anchored, hands on chest',
    'Mountain Climbers':'Fast feet, stable hips',
    'Star Jumps':'Full extension at top',
    'High Knees':'Drive arms, lift knees to hip height',
    'Leg Raises':'Lower back pressed to floor',
    'Russian Twists':'Control rotation, feet off floor for advanced',
    'Flutter Kicks':'Small rapid kicks, lower back flat'
  };
  return notes[name]||(level==='advanced'?'Maximum effort — full range of motion':'Controlled movement — quality over speed');
}

function generate(){
  const sessName=document.getElementById('sessName').value.trim()||'Circuit Session';
  const pax=document.getElementById('pax').value||'N/A';
  const level=document.getElementById('level').value;
  const circType=document.getElementById('circType').value;
  const format=document.getElementById('format').value;
  const stationCount=parseInt(document.getElementById('stations').value);
  const rounds=parseInt(document.getElementById('rounds').value);
  const work=parseInt(document.getElementById('work').value);
  const rest=parseInt(document.getElementById('rest').value);
  const equipment=document.getElementById('equipment').value;
  const notes=document.getElementById('notes').value.trim();

  const exercises=buildExList(circType,stationCount,equipment);
  const roundTimeMin=Math.round(exercises.length*(work+rest)/60*10)/10;
  const totalMin=Math.round(rounds*roundTimeMin+5+5);
  const now=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});

  const circTypeLabels={strength:'Strength Focus',cardio:'Cardio Focus',mixed:'Mixed (Strength + Cardio)',core:'Core Focus',upper:'Upper Body Focus',lower:'Lower Body Focus'};
  const formatLabels={timed:'Timed Work:Rest',reps:'Reps Based',emom:'EMOM'};

  const html=`
    <div class="rpt-header">
      <div>
        <div class="rpt-title">Circuit <span>Session</span></div>
        <div class="rpt-meta">Generated ${now} — ${sessName} — ${pax} pax — ${circTypeLabels[circType]}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-sec" onclick="window.print()">Print / Save PDF</button>
        <button class="btn-sec" onclick="document.getElementById('reportArea').style.display='none';document.getElementById('emptyState').style.display='flex';">Reset</button>
      </div>
    </div>
    <div class="stats-bar">
      <div><div class="stat-label">Stations</div><div class="stat-val">${stationCount}</div></div>
      <div><div class="stat-label">Rounds</div><div class="stat-val">${rounds}</div></div>
      <div><div class="stat-label">Work:Rest</div><div class="stat-val" style="font-size:15px;">${work}s:${rest}s</div></div>
      <div><div class="stat-label">Est. Duration</div><div class="stat-val">${totalMin} min</div></div>
    </div>

    <div class="section">
      <div class="section-title">Session Structure</div>
      <div class="structure-grid">
        <div class="struct-card"><div class="struct-label">Warm-Up</div><div class="struct-val">5 min</div><div style="font-size:11px;color:var(--muted);margin-top:4px;">Dynamic movement prep</div></div>
        <div class="struct-card"><div class="struct-label">Main Circuit</div><div class="struct-val">${Math.round(roundTimeMin*rounds)} min</div><div style="font-size:11px;color:var(--muted);margin-top:4px;">${rounds} rounds × ${stationCount} stations</div></div>
        <div class="struct-card"><div class="struct-label">Cool-Down</div><div class="struct-val">5 min</div><div style="font-size:11px;color:var(--muted);margin-top:4px;">Static stretch, debrief</div></div>
      </div>
      <div style="padding:10px;background:var(--sand);border-radius:var(--radius);font-size:13px;color:var(--text2);">
        <strong>Format:</strong> ${formatLabels[format]} — <strong>Level:</strong> ${level.charAt(0).toUpperCase()+level.slice(1)} — <strong>Equipment:</strong> ${equipment}
      </div>
    </div>

    <div class="section">
      <div class="section-title">Circuit Stations</div>
      <div class="round-badge">${rounds} Rounds</div>
      <div style="display:grid;grid-template-columns:30px 1fr 120px 120px;gap:10px;padding:6px 10px;background:var(--sand);border-radius:var(--radius);margin-bottom:6px;">
        <div style="font-size:10px;font-weight:700;color:var(--muted);">#</div>
        <div style="font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);">Exercise</div>
        <div style="font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);text-align:right;">Load</div>
        <div style="font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);text-align:right;">Category</div>
      </div>
      ${exercises.map((ex,i)=>`
        <div class="ex-row">
          <div class="ex-num">${i+1}</div>
          <div>
            <div class="ex-name">${ex.name}</div>
            <div class="ex-detail">${getCoachNote(ex.name,level)}</div>
          </div>
          <div class="ex-load">${getLoad(format,work,rest,level,ex.name)}</div>
          <div class="ex-rest" style="text-align:right;">${ex.cat}</div>
        </div>`).join('')}
    </div>

    <div class="section">
      <div class="section-title">Warm-Up (5 min)</div>
      ${['Jog on the spot — 60s','Arm circles forward and backward — 30s each','Hip circles — 30s each direction','Leg swings forward/back — 10 each leg','Lateral leg swings — 10 each leg','Squats with hold at bottom — 10 reps','Inchworm walk-out — 5 reps'].map(w=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);">▸ ${w}</div>`).join('')}
    </div>

    <div class="section">
      <div class="section-title">Cool-Down (5 min)</div>
      ${['Easy walk — 60s','Quad stretch — 30s each leg','Hamstring stretch — 30s each leg','Hip flexor lunge stretch — 30s each side','Chest stretch — 30s','Child\'s pose — 30s','Deep breathing — 60s'].map(w=>`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);">▸ ${w}</div>`).join('')}
    </div>

    ${notes?`<div class="section"><div class="section-title">PTI Notes</div><p style="font-size:13px;color:var(--text2);">${notes}</p></div>`:''}

    <div class="disclaimer"><strong>Disclaimer:</strong> PTI judgment must be applied when delivering this session. Modify exercises as required for personnel with medical restrictions.</div>`;

  document.getElementById('emptyState').style.display='none';
  const ra=document.getElementById('reportArea');
  ra.style.display='block';
  ra.innerHTML=html;
  ra.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
