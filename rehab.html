<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADF PTI — Rehab Program Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1f16;--ink2:#242920;--red:#c8392b;--red2:#e05a40;--orange:#e8a020;--cream:#f5f2eb;--sand:#ede8dc;--card:#ffffff;--border:#d0c8b8;--muted:#7a7060;--text:#1a1a16;--text2:#55504a;--radius:4px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
header{background:var(--ink);color:#fff;padding:0 2rem;display:flex;align-items:stretch;border-bottom:3px solid var(--red);}
.hflag{background:var(--red);width:6px;margin-right:1.5rem;}
.htext{padding:1.25rem 0;}
.hey{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:4px;}
header h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1;}
header h1 span{color:var(--red2);}
.hsub{font-size:12px;color:#aaa;margin-top:4px;font-weight:300;}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;}
.hlink{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius);padding:4px 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#aaa;font-weight:600;text-decoration:none;}
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 72px);}
.sidebar{background:var(--sand);border-right:1px solid var(--border);padding:1.5rem;overflow-y:auto;}
.slabel{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:.75rem;padding-bottom:5px;border-bottom:1px solid var(--border);}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:.75rem;}
.fg label{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2);}
input,select,textarea{font-family:'Barlow',sans-serif;font-size:13.5px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--text);width:100%;}
input:focus,select:focus{outline:none;border-color:var(--red);}
textarea{resize:vertical;min-height:60px;}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:.75rem;}
.btn-gen{width:100%;background:var(--ink);color:#fff;border:none;border-radius:var(--radius);padding:13px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:.75rem;}
.btn-gen:hover{background:var(--red);}
.output{padding:2rem;overflow-y:auto;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:400px;text-align:center;opacity:.45;}
.empty-icon{width:64px;height:64px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;font-size:28px;}
.empty h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.empty p{font-size:13px;color:var(--muted);}
.rpt-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid var(--ink);}
.rpt-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1.1;}
.rpt-title span{color:var(--red);}
.rpt-meta{font-size:12px;color:var(--muted);margin-top:4px;}
.stats-bar{background:var(--ink);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1.25rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;}
.stat-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:3px;}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--orange);}
.btn-sec{background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:var(--radius);padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;}
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);margin-bottom:.75rem;padding-bottom:5px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';display:inline-block;width:4px;height:13px;background:var(--red);border-radius:2px;}
.phase-block{margin-bottom:1.25rem;}
.phase-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--red);margin-bottom:.5rem;padding:8px 10px;background:var(--sand);border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center;}
.phase-weeks{font-size:12px;font-weight:400;color:var(--muted);}
.ex-row{display:grid;grid-template-columns:1fr 80px 100px;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;align-items:start;}
.ex-row:last-child{border-bottom:none;}
.ex-name{font-weight:600;color:var(--ink);}
.ex-note{font-size:11px;color:var(--muted);margin-top:2px;}
.ex-sets{text-align:center;font-weight:600;}
.ex-load{text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--red);}
.warning-box{background:#fff8f0;border:1px solid var(--orange);border-radius:var(--radius);padding:10px 14px;margin-bottom:1rem;font-size:13px;color:#7a5a10;}
.disclaimer{background:#fdf0ee;border:1px solid var(--red);border-radius:var(--radius);padding:10px 14px;margin-top:1rem;font-size:12px;color:var(--red);}
@media(max-width:900px){.layout{grid-template-columns:1fr;}}
@media print{.sidebar,.hright{display:none!important;}.layout{display:block;}.output{padding:1rem;}}
</style>
</head>
<body>
<header>
  <div class="hflag"></div>
  <div class="htext">
    <div class="hey">Australian Defence Force</div>
    <h1>PTI <span>Rehab</span> Program Generator</h1>
    <div class="hsub">Return-to-Duty Exercise Rehabilitation Planner</div>
  </div>
  <div class="hright"><a class="hlink" href="index.html">← Back to Tools</a></div>
</header>
<div class="layout">
  <div class="sidebar">
    <div class="slabel">Member Details</div>
    <div class="fgrid2">
      <div class="fg"><label>Full Name</label><input type="text" id="name" placeholder="e.g. CPL Smith, J."></div>
      <div class="fg"><label>Age</label><input type="number" id="age" placeholder="e.g. 28"></div>
      <div class="fg"><label>Unit</label><input type="text" id="unit" placeholder="e.g. 3 RAR"></div>
      <div class="fg"><label>Duty Status</label>
        <select id="duty"><option value="light">Light Duties</option><option value="modified">Modified Duties</option><option value="full" selected>Full Duties</option></select>
      </div>
    </div>
    <div class="slabel">Injury Details</div>
    <div class="fg"><label>Injury / Condition</label>
      <select id="injury">
        <option value="lower_back">Lower Back Pain</option>
        <option value="knee">Knee (general)</option>
        <option value="ankle">Ankle Sprain</option>
        <option value="shoulder">Shoulder (general)</option>
        <option value="hamstring">Hamstring Strain</option>
        <option value="calf">Calf / Achilles</option>
        <option value="hip">Hip Flexor / Groin</option>
        <option value="shin">Shin Splints (MTSS)</option>
        <option value="stress_fx">Stress Fracture (lower limb)</option>
        <option value="rotator_cuff">Rotator Cuff</option>
        <option value="plantar">Plantar Fasciitis</option>
        <option value="patellar">Patellar Tendinopathy</option>
      </select>
    </div>
    <div class="fgrid2">
      <div class="fg"><label>Rehab Phase</label>
        <select id="phase">
          <option value="acute">Acute (0–2 weeks)</option>
          <option value="subacute" selected>Sub-Acute (2–6 weeks)</option>
          <option value="recon">Reconditioning (6–12 weeks)</option>
          <option value="rtd">Return to Duty (12+ weeks)</option>
        </select>
      </div>
      <div class="fg"><label>Pain Level (0–10)</label>
        <select id="pain">
          <option value="0">0 — No pain</option>
          <option value="2">1–2 — Minimal</option>
          <option value="4" selected>3–4 — Mild</option>
          <option value="6">5–6 — Moderate</option>
          <option value="8">7–8 — Severe</option>
        </select>
      </div>
    </div>
    <div class="slabel">Program Setup</div>
    <div class="fgrid2">
      <div class="fg"><label>Duration (weeks)</label>
        <select id="weeks"><option value="4">4 weeks</option><option value="6" selected>6 weeks</option><option value="8">8 weeks</option><option value="12">12 weeks</option></select>
      </div>
      <div class="fg"><label>Sessions/Week</label>
        <select id="sessions"><option value="3">3/week</option><option value="4">4/week</option><option value="5" selected>5/week</option></select>
      </div>
    </div>
    <div class="fg"><label>Available Equipment</label>
      <select id="equip"><option value="none">None / Bodyweight</option><option value="basic" selected>Basic (bands, light weights)</option><option value="gym">Full Gym</option></select>
    </div>
    <div class="fg"><label>Goal</label>
      <select id="goal"><option value="rtd" selected>Return to Full Duty</option><option value="pfa">Return to PFA Standard</option><option value="maintain">Maintain Fitness During Injury</option></select>
    </div>
    <div class="fg"><label>Medical Notes / Restrictions</label>
      <textarea id="notes" placeholder="e.g. Cleared by MO for non-weight-bearing upper body work only"></textarea>
    </div>
    <button class="btn-gen" onclick="generate()">Generate Rehab Program</button>
  </div>
  <div class="output">
    <div class="empty" id="emptyState">
      <div class="empty-icon">🩺</div>
      <h2>No Program Generated</h2>
      <p>Enter injury details and press<br>Generate Rehab Program.</p>
    </div>
    <div id="reportArea" style="display:none;"></div>
  </div>
</div>
<script>
const REHAB={
  lower_back:{phases:{acute:[{name:'Diaphragmatic Breathing',sets:'3×10 breaths',load:'Supine',note:'Full exhale, belly rise on inhale'},{name:'Knee to Chest Stretch',sets:'3×30s each',load:'Gentle',note:'No pain — stop if increases symptoms'},{name:'Pelvic Tilts',sets:'3×15',load:'Supine',note:'Flatten lumbar spine to floor, hold 3s'},{name:'Dead Bug (arms only)',sets:'3×8',load:'Slow',note:'Lower back stays pressed to floor'}],subacute:[{name:'Bird Dog',sets:'3×10/side',load:'Slow',note:'Neutral spine throughout'},{name:'Glute Bridge',sets:'3×15',load:'Bodyweight',note:'Squeeze glutes at top, hold 2s'},{name:'Side Plank (knees)',sets:'3×20s',load:'Bodyweight',note:'Progress to feet when pain free'},{name:'Dead Bug (full)',sets:'3×8/side',load:'Controlled',note:'Lower back must stay flat'},{name:'Hip Hinge (bodyweight)',sets:'3×12',load:'Bodyweight',note:'Push hips back, soft knees — feel hamstrings'}],recon:[{name:'Romanian Deadlift',sets:'3×10',load:'Light–moderate',note:'Hinge at hips, brace core'},{name:'Goblet Squat',sets:'3×12',load:'Light–moderate',note:'Upright torso, full depth if pain free'},{name:'Plank',sets:'3×30s',load:'Bodyweight',note:'Progress duration weekly'},{name:'Single-Leg Deadlift',sets:'3×8/side',load:'Light',note:'Balance challenge + posterior chain'},{name:'Farmer\'s Carry',sets:'3×20m',load:'Moderate (even loading)',note:'Neutral spine, walk tall'}],rtd:[{name:'Back Squat / Deadlift',sets:'4×8',load:'Progressive',note:'Monitor pain — stop at >3/10'},{name:'Loaded Carry (bilateral)',sets:'3×30m',load:'Moderate–heavy',note:'Simulate pack march load'},{name:'Plank Variations',sets:'3×45s',load:'Bodyweight',note:'Stir the pot, body saw'},{name:'Hip Hinge + Row',sets:'3×10',load:'Moderate',note:'Combined posterior chain + pull'}]}},
  knee:{phases:{acute:[{name:'Quad Sets',sets:'3×15',load:'Isometric',note:'Tighten quad, hold 5s, heel on mat'},{name:'Heel Slides',sets:'3×15',load:'Gravity only',note:'Slide heel toward glute, controlled return'},{name:'Straight Leg Raise',sets:'3×15',load:'Bodyweight',note:'Lock knee, raise 45°, hold 2s'},{name:'Ice + Elevation',sets:'3–4×day',load:'PRICE protocol',note:'15–20 min at a time'}],subacute:[{name:'Mini Squat (0–45°)',sets:'3×15',load:'Bodyweight',note:'Pain-free range only'},{name:'Step-Up (low box)',sets:'3×12/leg',load:'Bodyweight',note:'Lead with injured leg going up'},{name:'Terminal Knee Extension (band)',sets:'3×15',load:'Light band',note:'Full extension against resistance'},{name:'Calf Raise',sets:'3×20',load:'Bodyweight',note:'Both legs, then progress to single'}],recon:[{name:'Bulgarian Split Squat',sets:'3×10/leg',load:'Light–moderate',note:'Front knee tracks over toes'},{name:'Leg Press',sets:'3×15',load:'Moderate',note:'Full ROM within pain limits'},{name:'Nordic Hamstring Curl',sets:'3×6',load:'Bodyweight',note:'Eccentric focus — control the descent'},{name:'Step-Down (eccentric)',sets:'3×10/leg',load:'Bodyweight',note:'Slow 4-second descent, single leg'}],rtd:[{name:'Back Squat',sets:'4×8',load:'Progressive',note:'Assess pain response after session'},{name:'Running Progression',sets:'Walk-run intervals',load:'Gradual',note:'Start 1:1 walk:run → progress weekly'},{name:'Plyometric Progression',sets:'3×10',load:'Low–moderate',note:'Box jump → land quietly, absorb with knees'}]}},
  shoulder:{phases:{acute:[{name:'Pendulum Swings',sets:'3×30s',load:'Gravity/arm weight',note:'Small circles — gravity traction'},{name:'Active ROM (pain free)',sets:'3×10 each direction',load:'Bodyweight',note:'Forward flex, abduction to pain limit'},{name:'Posture Correction',sets:'Every hour',load:'Awareness',note:'Scapular retraction, chin tuck'}],subacute:[{name:'Scapular Push-Up',sets:'3×15',load:'Bodyweight',note:'Protract and retract — no arm bend'},{name:'Band External Rotation',sets:'3×15',load:'Light band',note:'Elbow at 90°, rotate slowly out'},{name:'Band Face Pull',sets:'3×15',load:'Light band',note:'Elbows high, pull to forehead level'},{name:'Prone Y-T-W',sets:'3×10 each',load:'No weight',note:'Shoulder blade moves, not just arm'}],recon:[{name:'DB Shoulder Press (limited ROM)',sets:'3×12',load:'Light',note:'Pain-free arc only — may be 90° max'},{name:'Lat Pulldown',sets:'3×12',load:'Moderate',note:'Slight lean back, pull to upper chest'},{name:'Cable Row',sets:'3×15',load:'Moderate',note:'Retract scapula at end of pull'},{name:'Push-Up Progression',sets:'3×max',load:'Bodyweight',note:'Wall → incline → floor progression'}],rtd:[{name:'Overhead Press',sets:'4×8',load:'Progressive',note:'Full ROM if pain free'},{name:'Pull-Ups / Chin-Ups',sets:'3×max',load:'Bodyweight',note:'Dead hang start, full extension'},{name:'Bench Press',sets:'4×8',load:'Progressive',note:'Monitor AC joint / rotator cuff response'}]}}
};

function generate(){
  const name=document.getElementById('name').value.trim()||'Member';
  const age=document.getElementById('age').value||'25';
  const unit=document.getElementById('unit').value.trim()||'N/A';
  const duty=document.getElementById('duty').value;
  const injury=document.getElementById('injury').value;
  const phase=document.getElementById('phase').value;
  const pain=parseInt(document.getElementById('pain').value)||4;
  const weeks=parseInt(document.getElementById('weeks').value)||6;
  const sessions=parseInt(document.getElementById('sessions').value)||5;
  const equip=document.getElementById('equip').value;
  const goal=document.getElementById('goal').value;
  const notes=document.getElementById('notes').value.trim();

  const injuryLabels={lower_back:'Lower Back Pain',knee:'Knee',ankle:'Ankle Sprain',shoulder:'Shoulder',hamstring:'Hamstring Strain',calf:'Calf/Achilles',hip:'Hip Flexor/Groin',shin:'Shin Splints (MTSS)',stress_fx:'Stress Fracture',rotator_cuff:'Rotator Cuff',plantar:'Plantar Fasciitis',patellar:'Patellar Tendinopathy'};
  const phaseLabels={acute:'Acute',subacute:'Sub-Acute',recon:'Reconditioning',rtd:'Return to Duty'};
  const goalLabels={rtd:'Return to Full Duty',pfa:'Return to PFA Standard',maintain:'Maintain Fitness'};
  const dutyLabels={light:'Light Duties',modified:'Modified Duties',full:'Full Duties'};

  // Get exercises for this injury and phase (fall back to lower_back if not found)
  const injData=REHAB[injury]||REHAB.lower_back;
  const phaseOrder=['acute','subacute','recon','rtd'];
  const phaseIdx=phaseOrder.indexOf(phase);

  // Build 4 phases across the weeks
  const weeksPerPhase=Math.max(1,Math.floor(weeks/Math.max(1,4-phaseIdx)));
  const phasePlan=[];
  let wStart=1;
  for(let pi=phaseIdx;pi<phaseOrder.length&&wStart<=weeks;pi++){
    const ph=phaseOrder[pi];
    const wEnd=pi===phaseOrder.length-1?weeks:Math.min(weeks,wStart+weeksPerPhase-1);
    const exs=injData.phases[ph]||injData.phases.subacute||[];
    phasePlan.push({phase:ph,label:phaseLabels[ph],weeks:[wStart,wEnd],exercises:exs});
    wStart=wEnd+1;
  }

  const now=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  const html=`
    <div class="rpt-header">
      <div>
        <div class="rpt-title">Rehab <span>Program</span></div>
        <div class="rpt-meta">Generated ${now} — ${name} — ${injuryLabels[injury]} — ${weeks} weeks</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-sec" onclick="window.print()">Print / Save PDF</button>
        <button class="btn-sec" onclick="document.getElementById('reportArea').style.display='none';document.getElementById('emptyState').style.display='flex';">Reset</button>
      </div>
    </div>

    <div class="warning-box">⚠️ <strong>Medical Clearance Required:</strong> This program must be reviewed and approved by a Medical Officer or Physiotherapist before implementation. Stop any exercise that increases pain above 3/10. Seek immediate attention for severe pain, swelling, or loss of function.</div>

    <div class="stats-bar">
      <div><div class="stat-label">Member</div><div class="stat-val" style="font-size:13px;">${name}</div></div>
      <div><div class="stat-label">Injury</div><div class="stat-val" style="font-size:12px;">${injuryLabels[injury]}</div></div>
      <div><div class="stat-label">Duty Status</div><div class="stat-val" style="font-size:12px;">${dutyLabels[duty]}</div></div>
      <div><div class="stat-label">Duration</div><div class="stat-val">${weeks} wks</div></div>
    </div>

    <div class="section">
      <div class="section-title">Rehabilitation Phases</div>
      ${phasePlan.map(p=>`
        <div class="phase-block">
          <div class="phase-title">${p.label} Phase <span class="phase-weeks">Weeks ${p.weeks[0]}–${p.weeks[1]}</span></div>
          <div style="display:grid;grid-template-columns:1fr 80px 100px;gap:10px;padding:5px 10px;background:var(--sand);border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;">
            <div>Exercise</div><div style="text-align:center;">Sets × Reps</div><div style="text-align:right;">Load</div>
          </div>
          ${p.exercises.map(ex=>`<div class="ex-row">
            <div><div class="ex-name">${ex.name}</div><div class="ex-note">${ex.note}</div></div>
            <div class="ex-sets">${ex.sets}</div>
            <div class="ex-load">${ex.load}</div>
          </div>`).join('')}
        </div>`).join('')}
    </div>

    <div class="section">
      <div class="section-title">Progression Criteria</div>
      ${['Move to the next phase only when pain is ≤2/10 during and after exercise.','Complete all sets/reps with correct technique before adding load.','No swelling or significant pain within 24 hours of the previous session.','Progress one variable at a time: reps, then sets, then load.','If pain increases above 3/10, reduce load by 50% and reassess.','Return to duty criteria must be confirmed by Medical Officer.'].map(r=>`<div style="padding:7px 0 7px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);position:relative;"><span style="position:absolute;left:0;color:var(--red);">▸</span>${r}</div>`).join('')}
    </div>

    ${notes?`<div class="section"><div class="section-title">Medical Notes / Restrictions</div><p style="font-size:13px;color:var(--text2);">${notes}</p></div>`:''}

    <div class="disclaimer"><strong>§ Medical Disclaimer:</strong> This program is general guidance only and must be reviewed by a Medical Officer or Physiotherapist before implementation. Stop any exercise that increases pain above 4/10. Seek immediate medical attention for severe pain, swelling, numbness or loss of function. All duty status changes must be authorised by a Medical Officer.</div>`;

  document.getElementById('emptyState').style.display='none';
  const ra=document.getElementById('reportArea');
  ra.style.display='block';
  ra.innerHTML=html;
  ra.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
