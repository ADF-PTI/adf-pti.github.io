<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADF PTI — Swim Program Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1f16;--ink2:#242920;--red:#c8392b;--red2:#e05a40;--orange:#e8a020;--cream:#f5f2eb;--sand:#ede8dc;--card:#ffffff;--border:#d0c8b8;--muted:#7a7060;--text:#1a1a16;--text2:#55504a;--radius:4px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
header{background:var(--ink);color:#fff;padding:0 2rem;display:flex;align-items:stretch;border-bottom:3px solid var(--red);}
.hflag{background:var(--red);width:6px;margin-right:1.5rem;}
.htext{padding:1.25rem 0;}
.hey{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:4px;}
header h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1;}
header h1 span{color:var(--red2);}
.hsub{font-size:12px;color:#aaa;margin-top:4px;font-weight:300;}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;}
.hlink{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius);padding:4px 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#aaa;font-weight:600;text-decoration:none;}
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 72px);}
.sidebar{background:var(--sand);border-right:1px solid var(--border);padding:1.5rem;overflow-y:auto;}
.slabel{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:.75rem;padding-bottom:5px;border-bottom:1px solid var(--border);}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:.75rem;}
.fg label{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2);}
input,select,textarea{font-family:'Barlow',sans-serif;font-size:13.5px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--text);width:100%;}
input:focus,select:focus{outline:none;border-color:var(--red);}
textarea{resize:vertical;min-height:60px;}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:.75rem;}
.btn-gen{width:100%;background:var(--ink);color:#fff;border:none;border-radius:var(--radius);padding:13px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:.75rem;}
.btn-gen:hover{background:var(--red);}
.output{padding:2rem;overflow-y:auto;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:400px;text-align:center;opacity:.45;}
.empty-icon{width:64px;height:64px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;font-size:28px;}
.empty h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.empty p{font-size:13px;color:var(--muted);}
.rpt-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid var(--ink);}
.rpt-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1.1;}
.rpt-title span{color:var(--red);}
.rpt-meta{font-size:12px;color:var(--muted);margin-top:4px;}
.stats-bar{background:var(--ink);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1.25rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;}
.stat-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:3px;}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--orange);}
.btn-sec{background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:var(--radius);padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;}
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);margin-bottom:.75rem;padding-bottom:5px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';display:inline-block;width:4px;height:13px;background:var(--red);border-radius:2px;}
.week-block{margin-bottom:1.25rem;}
.week-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--red);margin-bottom:.5rem;padding:6px 10px;background:var(--sand);border-radius:var(--radius);}
.set-row{padding:8px 12px;border-bottom:1px solid var(--border);font-size:13px;display:grid;grid-template-columns:1fr 120px;}
.set-row:last-child{border-bottom:none;}
.set-name{font-weight:600;color:var(--ink);}
.set-detail{font-size:11px;color:var(--muted);margin-top:2px;}
.set-dist{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--red);text-align:right;}
.disclaimer{background:var(--sand);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-top:1rem;font-size:12px;color:var(--muted);font-style:italic;}
@media(max-width:900px){.layout{grid-template-columns:1fr;}}
@media print{.sidebar,.hright{display:none!important;}.layout{display:block;}.output{padding:1rem;}}
</style>
</head>
<body>
<header>
  <div class="hflag"></div>
  <div class="htext">
    <div class="hey">Australian Defence Force</div>
    <h1>PTI <span>Swim</span> Program Builder</h1>
    <div class="hsub">ADF Swimming Program Generator</div>
  </div>
  <div class="hright"><a class="hlink" href="index.html">← Back to Tools</a></div>
</header>
<div class="layout">
  <div class="sidebar">
    <div class="slabel">Member Details</div>
    <div class="fg"><label>Full Name</label><input type="text" id="name" placeholder="e.g. CPL Smith, J."></div>
    <div class="fgrid2">
      <div class="fg"><label>Unit</label><input type="text" id="unit" placeholder="e.g. 3 RAR"></div>
      <div class="fg"><label>Sex</label><select id="sex"><option>Male</option><option>Female</option></select></div>
    </div>
    <div class="slabel">Swimming Ability</div>
    <div class="fg"><select id="ability">
      <option value="non_swimmer">Non-Swimmer (cannot complete 50m)</option>
      <option value="weak">Weak Swimmer (50–200m with difficulty)</option>
      <option value="moderate" selected>Moderate (can complete 400m)</option>
      <option value="competent">Competent (400m+ comfortable)</option>
      <option value="strong">Strong Swimmer (1000m+ comfortable)</option>
    </select></div>
    <div class="slabel">Training Goal</div>
    <div class="fg"><select id="goal">
      <option value="survival">Survival Swimming (ADF min standard)</option>
      <option value="fitness" selected>General Fitness Swimming</option>
      <option value="endurance">Endurance (1500m+)</option>
      <option value="water_polo">Water Polo / Combat Swimming</option>
    </select></div>
    <div class="slabel">Program Setup</div>
    <div class="fgrid2">
      <div class="fg"><label>Duration (weeks)</label>
        <select id="weeks"><option value="4">4 weeks</option><option value="6">6 weeks</option><option value="8" selected>8 weeks</option><option value="12">12 weeks</option></select>
      </div>
      <div class="fg"><label>Sessions/Week</label>
        <select id="sessions"><option value="2">2/week</option><option value="3" selected>3/week</option><option value="4">4/week</option></select>
      </div>
    </div>
    <div class="fgrid2">
      <div class="fg"><label>Pool Length</label>
        <select id="pool"><option value="25">25m pool</option><option value="50">50m pool</option></select>
      </div>
      <div class="fg"><label>Uniform</label>
        <select id="uniform"><option value="cossie">Swimwear</option><option value="pt">PT uniform</option><option value="DPCU">DPCU / Boots</option></select>
      </div>
    </div>
    <div class="fg"><label>Notes / Restrictions</label>
      <textarea id="notes" placeholder="e.g. Ear infection last month, avoid underwater work"></textarea>
    </div>
    <button class="btn-gen" onclick="generate()">Generate Swim Program</button>
  </div>
  <div class="output">
    <div class="empty" id="emptyState">
      <div class="empty-icon">🏊</div>
      <h2>No Program Generated</h2>
      <p>Fill in the details and press<br>Generate Swim Program.</p>
    </div>
    <div id="reportArea" style="display:none;"></div>
  </div>
</div>
<script>
function generate(){
  const name=document.getElementById('name').value.trim()||'Member';
  const unit=document.getElementById('unit').value.trim()||'N/A';
  const sex=document.getElementById('sex').value;
  const ability=document.getElementById('ability').value;
  const goal=document.getElementById('goal').value;
  const weeks=parseInt(document.getElementById('weeks').value)||8;
  const sessPerWeek=parseInt(document.getElementById('sessions').value)||3;
  const pool=parseInt(document.getElementById('pool').value)||25;
  const uniform=document.getElementById('uniform').value;
  const notes=document.getElementById('notes').value.trim();

  const abilityBase={non_swimmer:200,weak:400,moderate:800,competent:1500,strong:2000};
  const baseM=abilityBase[ability]||800;

  const goalLabels={survival:'Survival Swimming',fitness:'General Fitness',endurance:'Endurance',water_polo:'Combat Swimming'};

  const sessions=[];
  const uniformNote=uniform==='DPCU'?' (in uniform + boots)':uniform==='pt'?' (in PT uniform)':'';

  for(let w=1;w<=weeks;w++){
    const progress=(w-1)/(weeks-1||1);
    const weekM=Math.round(baseM*(1+progress*0.8)/50)*50;
    const weekSess=[];
    for(let s=0;s<sessPerWeek;s++){
      const isLong=s===sessPerWeek-1;
      const sessM=isLong?Math.round(weekM*0.45/pool)*pool:Math.round(weekM*0.3/pool)*pool;
      const sets=[];

      if(ability==='non_swimmer'||ability==='weak'){
        sets.push({name:'Warm-Up — Kick with Board',detail:'Focus on leg drive, arms relaxed',dist:`${pool*2}m`});
        sets.push({name:'Freestyle with Rest',detail:`${pool}m swim, ${pool}m rest at wall — repeat`,dist:`${Math.round(sessM*0.4/pool)*pool}m`});
        sets.push({name:'Backstroke',detail:'Alternate arm pull, steady kick',dist:`${Math.round(sessM*0.3/pool)*pool}m`});
        sets.push({name:'Cool-Down — Easy Kick',detail:'Relax and breathe',dist:`${pool*2}m`});
      } else if(isLong){
        sets.push({name:'Warm-Up',detail:'400m easy freestyle — build pace',dist:'400m'});
        sets.push({name:'Main Set — Endurance',detail:`${Math.round(sessM*0.5/pool)*pool}m at steady pace${uniformNote}`,dist:`${Math.round(sessM*0.5/pool)*pool}m`});
        sets.push({name:'Stroke Work',detail:'100m each: backstroke, breaststroke, freestyle',dist:'300m'});
        sets.push({name:'Cool-Down',detail:'Easy 200m — any stroke',dist:'200m'});
      } else if(s===0){
        sets.push({name:'Warm-Up',detail:'200m easy freestyle',dist:'200m'});
        sets.push({name:'Interval Set',detail:`8×${pool}m at strong pace — 20s rest between${uniformNote}`,dist:`${pool*8}m`});
        sets.push({name:'Kick Set',detail:`4×${pool}m kick only with board`,dist:`${pool*4}m`});
        sets.push({name:'Cool-Down',detail:'Easy 200m choice of stroke',dist:'200m'});
      } else {
        sets.push({name:'Warm-Up',detail:'300m easy — alternate strokes',dist:'300m'});
        sets.push({name:'Technique Set',detail:`6×${pool}m focusing on catch and pull${uniformNote}`,dist:`${pool*6}m`});
        sets.push({name:'Pyramid Set',detail:`${pool}m, ${pool*2}m, ${pool*3}m, ${pool*2}m, ${pool}m — 30s rest`,dist:`${pool*9}m`});
        sets.push({name:'Cool-Down',detail:'Easy 100m, stretch in water',dist:'100m'});
      }
      weekSess.push({label:`Session ${s+1}${isLong?' (Long)':''}`,sets,totalM:sets.reduce((a,s)=>a+parseInt(s.dist)||0,0)});
    }
    sessions.push({week:w,weekM,weekSess});
  }

  const now=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  const html=`
    <div class="rpt-header">
      <div>
        <div class="rpt-title">Swim <span>Program</span></div>
        <div class="rpt-meta">Generated ${now} — ${name} — ${weeks} weeks — ${goalLabels[goal]}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-sec" onclick="window.print()">Print / Save PDF</button>
        <button class="btn-sec" onclick="document.getElementById('reportArea').style.display='none';document.getElementById('emptyState').style.display='flex';">Reset</button>
      </div>
    </div>
    <div class="stats-bar">
      <div><div class="stat-label">Member</div><div class="stat-val" style="font-size:15px;">${name}</div></div>
      <div><div class="stat-label">Goal</div><div class="stat-val" style="font-size:13px;">${goalLabels[goal]}</div></div>
      <div><div class="stat-label">Pool</div><div class="stat-val">${pool}m</div></div>
      <div><div class="stat-label">Duration</div><div class="stat-val">${weeks} wks</div></div>
    </div>
    <div class="section">
      <div class="section-title">Week-by-Week Program</div>
      ${sessions.map(w=>`
        <div class="week-block">
          <div class="week-title">Week ${w.week} — ~${w.weekM}m total volume${w.week%4===0&&w.week<weeks?' 🔄 Deload':''}</div>
          ${w.weekSess.map(s=>`
            <div style="margin-bottom:10px;">
              <div style="font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;padding-left:10px;">${s.label}</div>
              ${s.sets.map(set=>`<div class="set-row">
                <div><div class="set-name">${set.name}</div><div class="set-detail">${set.detail}</div></div>
                <div class="set-dist">${set.dist}</div>
              </div>`).join('')}
            </div>`).join('')}
        </div>`).join('')}
    </div>
    ${notes?`<div class="section"><div class="section-title">Notes / Restrictions</div><p style="font-size:13px;color:var(--text2);">${notes}</p></div>`:''}
    <div class="disclaimer"><strong>Safety Notice:</strong> All swimming must be conducted with qualified supervision. Personnel must not swim alone. Advise the duty PTI of any medical conditions before entering the water.</div>`;

  document.getElementById('emptyState').style.display='none';
  const ra=document.getElementById('reportArea');
  ra.style.display='block';
  ra.innerHTML=html;
  ra.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
