<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADF PTI — Remedial PT Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1f16;--ink2:#242920;--red:#c8392b;--red2:#e05a40;--orange:#e8a020;--cream:#f5f2eb;--sand:#ede8dc;--card:#ffffff;--border:#d0c8b8;--muted:#7a7060;--text:#1a1a16;--text2:#55504a;--radius:4px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
header{background:var(--ink);color:#fff;padding:0 2rem;display:flex;align-items:stretch;border-bottom:3px solid var(--red);}
.hflag{background:var(--red);width:6px;margin-right:1.5rem;}
.htext{padding:1.25rem 0;}
.hey{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:4px;}
header h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1;}
header h1 span{color:var(--red2);}
.hsub{font-size:12px;color:#aaa;margin-top:4px;font-weight:300;}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;}
.hlink{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius);padding:4px 12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#aaa;font-weight:600;text-decoration:none;}
.layout{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 72px);}
.sidebar{background:var(--sand);border-right:1px solid var(--border);padding:1.5rem;overflow-y:auto;}
.slabel{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:.75rem;padding-bottom:5px;border-bottom:1px solid var(--border);}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:.75rem;}
.fg label{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink2);}
input,select,textarea{font-family:'Barlow',sans-serif;font-size:13.5px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--text);width:100%;}
input:focus,select:focus{outline:none;border-color:var(--red);}
textarea{resize:vertical;min-height:60px;}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:.75rem;}
.fail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:.75rem;}
.fchip{border:1.5px solid var(--border);border-radius:var(--radius);padding:7px 8px;cursor:pointer;background:var(--card);font-size:12px;font-weight:600;text-align:center;}
.fchip.sel{border-color:var(--red);background:#fdf0ee;color:var(--red);}
.btn-gen{width:100%;background:var(--ink);color:#fff;border:none;border-radius:var(--radius);padding:13px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;margin-top:.75rem;}
.btn-gen:hover{background:var(--red);}
.output{padding:2rem;overflow-y:auto;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:400px;text-align:center;opacity:.45;}
.empty-icon{width:64px;height:64px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;font-size:28px;}
.empty h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.empty p{font-size:13px;color:var(--muted);}
.rpt-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid var(--ink);}
.rpt-title{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;letter-spacing:1px;text-transform:uppercase;line-height:1.1;}
.rpt-title span{color:var(--red);}
.rpt-meta{font-size:12px;color:var(--muted);margin-top:4px;}
.stats-bar{background:var(--ink);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1.25rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;}
.stat-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:3px;}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--orange);}
.btn-sec{background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:var(--radius);padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;}
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
.section-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);margin-bottom:.75rem;padding-bottom:5px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';display:inline-block;width:4px;height:13px;background:var(--red);border-radius:2px;}
.week-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--red);margin-bottom:.5rem;padding:6px 10px;background:var(--sand);border-radius:var(--radius);}
.sess-row{display:grid;grid-template-columns:80px 1fr 100px;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;align-items:start;}
.sess-row:last-child{border-bottom:none;}
.sess-day{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
.sess-type{font-weight:600;color:var(--ink);}
.sess-detail{font-size:12px;color:var(--text2);margin-top:2px;}
.sess-load{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--red);text-align:right;}
.std-table{width:100%;border-collapse:collapse;font-size:12px;}
.std-table th{background:var(--sand);padding:6px 10px;text-align:left;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
.std-table td{padding:7px 10px;border-bottom:1px solid var(--border);}
.fail-badge{display:inline-block;background:#fdf0ee;border:1px solid var(--red);color:var(--red);font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;}
.disclaimer{background:var(--sand);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-top:1rem;font-size:12px;color:var(--muted);font-style:italic;}
@media(max-width:900px){.layout{grid-template-columns:1fr;}}
@media print{.sidebar,.hright{display:none!important;}.layout{display:block;}.output{padding:1rem;}}
</style>
</head>
<body>
<header>
  <div class="hflag"></div>
  <div class="htext">
    <div class="hey">Australian Defence Force</div>
    <h1>PTI <span>Remedial</span> PT Planner</h1>
    <div class="hsub">ADF PFA Remedial Program Generator</div>
  </div>
  <div class="hright"><a class="hlink" href="index.html">← Back to Tools</a></div>
</header>
<div class="layout">
  <div class="sidebar">
    <div class="slabel">Member Details</div>
    <div class="fg"><label>Full Name</label><input type="text" id="name" placeholder="e.g. PTE Jones, B."></div>
    <div class="fgrid2">
      <div class="fg"><label>Service</label>
        <select id="service"><option value="ARA">ARA (Army)</option><option value="RAN">RAN (Navy)</option><option value="RAAF">RAAF (Air Force)</option></select>
      </div>
      <div class="fg"><label>Sex</label><select id="sex"><option>Male</option><option>Female</option></select></div>
    </div>
    <div class="fgrid2">
      <div class="fg"><label>Age</label><input type="number" id="age" placeholder="e.g. 24" min="17" max="65"></div>
      <div class="fg"><label>Unit</label><input type="text" id="unit" placeholder="e.g. 1 RAR"></div>
    </div>
    <div class="slabel">Failed Components</div>
    <div class="fail-grid">
      <div class="fchip sel" id="fc_run" onclick="togFail('run')">2.4 km Run</div>
      <div class="fchip" id="fc_pushups" onclick="togFail('pushups')">Push-Ups</div>
      <div class="fchip" id="fc_situps" onclick="togFail('situps')">Sit-Ups</div>
      <div class="fchip" id="fc_beep" onclick="togFail('beep')">BEEP Test</div>
      <div class="fchip" id="fc_swim" onclick="togFail('swim')">Swim Test</div>
    </div>
    <div class="slabel">Current Results</div>
    <div class="fg"><label>2.4 km Time (min:sec)</label>
      <div style="display:grid;grid-template-columns:1fr 1fr 20px;gap:6px;align-items:center;">
        <input type="number" id="runmin" placeholder="Min"><input type="number" id="runsec" placeholder="Sec">
        <span style="font-size:16px;font-weight:700;color:var(--muted);text-align:center;">:</span>
      </div>
    </div>
    <div class="fgrid2">
      <div class="fg"><label>Push-Ups (count)</label><input type="number" id="pushups" placeholder="e.g. 12"></div>
      <div class="fg"><label>Sit-Ups (count)</label><input type="number" id="situps" placeholder="e.g. 20"></div>
    </div>
    <div class="fg"><label>BEEP Test Level</label><input type="text" id="beep" placeholder="e.g. 7.4"></div>
    <div class="slabel">Program Setup</div>
    <div class="fgrid2">
      <div class="fg"><label>Duration (weeks)</label>
        <select id="weeks"><option value="4">4 weeks</option><option value="6" selected>6 weeks</option><option value="8">8 weeks</option><option value="12">12 weeks</option></select>
      </div>
      <div class="fg"><label>Sessions/Week</label>
        <select id="days"><option value="3">3/week</option><option value="4">4/week</option><option value="5" selected>5/week</option></select>
      </div>
    </div>
    <div class="fg"><label>Medical Restrictions</label>
      <select id="med"><option value="none">None</option><option value="upper">No upper body loading</option><option value="lower">No lower body loading</option><option value="run">No running — walk only</option></select>
    </div>
    <div class="fg"><label>Notes</label><textarea id="notes" placeholder="e.g. Member has history of knee pain"></textarea></div>
    <button class="btn-gen" onclick="generate()">Generate Remedial Plan</button>
  </div>
  <div class="output">
    <div class="empty" id="emptyState">
      <div class="empty-icon">📋</div>
      <h2>No Plan Generated</h2>
      <p>Enter member details and failed<br>components, then generate.</p>
    </div>
    <div id="reportArea" style="display:none;"></div>
  </div>
</div>
<script>
const failedComps=new Set(['run']);
function togFail(c){if(failedComps.has(c)){failedComps.delete(c);document.getElementById('fc_'+c).classList.remove('sel');}else{failedComps.add(c);document.getElementById('fc_'+c).classList.add('sel');}}
function toSec(m,s){return(parseInt(m)||0)*60+(parseInt(s)||0);}
function toMMSS(s){if(!s||s<=0)return'--:--';return Math.floor(s/60)+':'+String(Math.round(s%60)).padStart(2,'0');}

// ADF PFA Standards
const PFA={
  ARA:{Male:{17:{run:744,pu:15,su:45,beep:7.5},25:{run:756,pu:15,su:45,beep:7.5},30:{run:810,pu:12,su:40,beep:7.0},35:{run:870,pu:10,su:35,beep:6.5},40:{run:930,pu:8,su:30,beep:6.0},45:{run:990,pu:6,su:25,beep:5.5}},
  Female:{17:{run:876,pu:8,su:35,beep:5.5},25:{run:888,pu:8,su:35,beep:5.5},30:{run:942,pu:6,su:30,beep:5.0},35:{run:1002,pu:5,su:25,beep:4.5},40:{run:1062,pu:4,su:20,beep:4.0},45:{run:1122,pu:3,su:15,beep:3.7}}},
  RAN:{Male:{17:{run:780,pu:15,su:45,beep:7.5},25:{run:780,pu:15,su:45,beep:7.5},30:{run:840,pu:12,su:40,beep:7.0},35:{run:900,pu:10,su:35,beep:6.5},40:{run:960,pu:8,su:30,beep:6.0},45:{run:1020,pu:6,su:25,beep:5.5}},
  Female:{17:{run:900,pu:8,su:35,beep:5.5},25:{run:900,pu:8,su:35,beep:5.5},30:{run:960,pu:6,su:30,beep:5.0},35:{run:1020,pu:5,su:25,beep:4.5},40:{run:1080,pu:4,su:20,beep:4.0},45:{run:1140,pu:3,su:15,beep:3.7}}},
  RAAF:{Male:{17:{run:744,pu:15,su:45,beep:7.5},25:{run:744,pu:15,su:45,beep:7.5},30:{run:798,pu:12,su:40,beep:7.0},35:{run:858,pu:10,su:35,beep:6.5},40:{run:918,pu:8,su:30,beep:6.0},45:{run:978,pu:6,su:25,beep:5.5}},
  Female:{17:{run:858,pu:8,su:35,beep:5.5},25:{run:858,pu:8,su:35,beep:5.5},30:{run:918,pu:6,su:30,beep:5.0},35:{run:978,pu:5,su:25,beep:4.5},40:{run:1038,pu:4,su:20,beep:4.0},45:{run:1098,pu:3,su:15,beep:3.7}}}
};
function getStd(service,sex,age){const s=PFA[service]||PFA.ARA;const g=s[sex]||s.Male;const keys=Object.keys(g).map(Number).sort((a,b)=>a-b);let k=keys[0];for(const key of keys){if(age>=key)k=key;}return g[k];}

function generate(){
  const name=document.getElementById('name').value.trim()||'Member';
  const service=document.getElementById('service').value;
  const sex=document.getElementById('sex').value;
  const age=parseInt(document.getElementById('age').value)||25;
  const unit=document.getElementById('unit').value.trim()||'N/A';
  const runSec=toSec(document.getElementById('runmin').value,document.getElementById('runsec').value);
  const pushups=parseInt(document.getElementById('pushups').value)||0;
  const situps=parseInt(document.getElementById('situps').value)||0;
  const beep=document.getElementById('beep').value||'N/A';
  const weeks=parseInt(document.getElementById('weeks').value)||6;
  const daysPerWeek=parseInt(document.getElementById('days').value)||5;
  const med=document.getElementById('med').value;
  const notes=document.getElementById('notes').value.trim();

  const std=getStd(service,sex,age);
  const fails=[...failedComps];
  const now=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});

  // Build week sessions
  const dayArr=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const slots=daysPerWeek===3?[0,2,4]:daysPerWeek===4?[0,1,3,4]:[0,1,2,3,4];

  function getSession(week,dayIdx){
    const progress=week/weeks;
    const sessions=[];
    if(fails.includes('run')&&med!=='run'){
      const pct=0.6+progress*0.35;
      const tgtSec=runSec?(runSec*0.92):std.run;
      const trainPace=Math.round(tgtSec/2.4*1.1);
      sessions.push({type:dayIdx%2===0?'Interval Running':'Tempo/Continuous Run',detail:dayIdx%2===0?`6×400m at target 2.4 km pace (${toMMSS(trainPace)}/km) — 90s jog recovery`:`${(2+progress*1.5).toFixed(1)} km at moderate pace — aim for negative splits`});
    }
    if(fails.includes('pushups')&&med!=='upper'){
      const targetPU=Math.max(pushups+1,Math.round(pushups+(std.pu-pushups)*progress));
      sessions.push({type:'Push-Up Progression',detail:`3 sets max effort push-ups — aim for ${Math.round(pushups+(std.pu-pushups)*progress*0.8)} reps. Rest 90s between sets. Finish with ${Math.round(targetPU*0.5)} partial-ROM reps.`});
    }
    if(fails.includes('situps')&&med!=='lower'){
      const targetSU=Math.round(situps+(std.su-situps)*progress*0.8);
      sessions.push({type:'Sit-Up / Core Work',detail:`3 sets max effort sit-ups — target ${targetSU} reps. Superset with plank holds (${Math.round(20+progress*40)}s). Rest 60s.`});
    }
    if(fails.includes('beep')){
      sessions.push({type:'BEEP Test Intervals',detail:`Shuttle run repeats at increasing intensity — 5 min warm-up → 3×3 min shuttle sets at BEEP test pace → 3 min rest between. Cool-down 5 min.`});
    }
    if(sessions.length===0){sessions.push({type:'General Fitness',detail:'30 min continuous aerobic activity at moderate intensity — choice of activity based on medical restrictions.'});}
    return sessions;
  }

  let weeksHTML='';
  for(let w=1;w<=weeks;w++){
    weeksHTML+=`<div style="margin-bottom:1.25rem;"><div class="week-title">Week ${w}${w===weeks?' — Re-Assessment Week':''}</div>`;
    slots.forEach((slot,i)=>{
      const sess=getSession(w,i);
      weeksHTML+=sess.map(s=>`<div class="sess-row"><div class="sess-day">${dayArr[slot]}</div><div><div class="sess-type">${s.type}</div><div class="sess-detail">${s.detail}</div></div><div class="sess-load">${w===weeks?'Assessment':'Session'}</div></div>`).join('');
    });
    weeksHTML+='</div>';
  }

  const html=`
    <div class="rpt-header">
      <div>
        <div class="rpt-title">Remedial <span>PT Plan</span></div>
        <div class="rpt-meta">Generated ${now} — ${name} — ${service} — ${weeks} weeks</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-sec" onclick="window.print()">Print / Save PDF</button>
        <button class="btn-sec" onclick="document.getElementById('reportArea').style.display='none';document.getElementById('emptyState').style.display='flex';">Reset</button>
      </div>
    </div>
    <div class="stats-bar">
      <div><div class="stat-label">Member</div><div class="stat-val" style="font-size:14px;">${name}</div></div>
      <div><div class="stat-label">Service / Age</div><div class="stat-val" style="font-size:14px;">${service}, ${age}</div></div>
      <div><div class="stat-label">Failed</div><div class="stat-val" style="font-size:13px;">${fails.join(', ')||'N/A'}</div></div>
      <div><div class="stat-label">Duration</div><div class="stat-val">${weeks} wks</div></div>
    </div>

    <div class="section">
      <div class="section-title">PFA Standards — ${service} ${sex} Age ${age}</div>
      <table class="std-table">
        <tr><th>Component</th><th>Standard Required</th><th>Current Result</th><th>Status</th></tr>
        <tr><td>2.4 km Run</td><td>${toMMSS(std.run)}</td><td>${runSec?toMMSS(runSec):'Not entered'}</td><td>${runSec?(runSec<=std.run?'<span style="color:#3a6b2a;font-weight:700;">✓ PASS</span>':'<span class=\"fail-badge\">FAIL</span>'):'—'}</td></tr>
        <tr><td>Push-Ups (2 min)</td><td>${std.pu} reps</td><td>${pushups||'Not entered'}</td><td>${pushups?(pushups>=std.pu?'<span style="color:#3a6b2a;font-weight:700;">✓ PASS</span>':'<span class=\"fail-badge\">FAIL</span>'):'—'}</td></tr>
        <tr><td>Sit-Ups (2 min)</td><td>${std.su} reps</td><td>${situps||'Not entered'}</td><td>${situps?(situps>=std.su?'<span style="color:#3a6b2a;font-weight:700;">✓ PASS</span>':'<span class=\"fail-badge\">FAIL</span>'):'—'}</td></tr>
        <tr><td>BEEP Test</td><td>Level ${std.beep}</td><td>${beep}</td><td>—</td></tr>
      </table>
    </div>

    <div class="section">
      <div class="section-title">Remedial Program — ${weeks} Weeks</div>
      ${weeksHTML}
    </div>
    ${notes?`<div class="section"><div class="section-title">Notes / Medical Restrictions</div><p style="font-size:13px;color:var(--text2);">${notes}</p></div>`:''}
    <div class="disclaimer"><strong>Disclaimer:</strong> This remedial plan must be supervised by a qualified PTI. Any medical restrictions must be endorsed by a Medical Officer. Re-assessment must be conducted by a certified PFA assessor.</div>`;

  document.getElementById('emptyState').style.display='none';
  const ra=document.getElementById('reportArea');
  ra.style.display='block';
  ra.innerHTML=html;
  ra.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
